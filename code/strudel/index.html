<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoundSpace 4ch Strudel</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="https://unpkg.com/@strudel/web@1.3.0"></script>
  <style>
    :root {
      --bg: #1a1a2e;
      --panel: #2e2e4e;
      --line: #555577;
      --text: #e0e0ff;
      --muted: #8888aa;
      --hot: #ffcc66;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px 16px;
      background: var(--bg);
      font-family: ui-monospace, Menlo, Consolas, monospace;
      color: var(--text);
    }

    .wrap {
      width: 720px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    canvas { display: block; border-radius: 8px; }

    .btn {
      margin: 0;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }

    .channel-head .btn {
      flex: 0 0 72px;
    }

    .channel-modes {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }

    .channel-modes .btn {
      flex: 0 0 auto;
      padding: 5px 8px;
      font-size: 11px;
    }

    .btn:hover { border-color: var(--text); }
    .btn:disabled { opacity: 0.45; cursor: default; }

    .btn.on {
      color: var(--bg);
      background: var(--hot);
      border-color: var(--hot);
    }

    #channels {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .channel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
    }

    .channel.playing {
      border-color: var(--ch, var(--hot));
    }

    .channel-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .channel-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ch);
      flex: 0 0 auto;
    }

    .channel.playing .channel-dot {
      box-shadow: 0 0 10px var(--ch);
    }

    .channel-title {
      font-size: 14px;
      letter-spacing: 0.04em;
    }

    .channel-map {
      color: var(--muted);
      font-size: 11px;
      flex: 1 1 auto;
    }

    .channel textarea {
      width: 100%;
      min-height: 84px;
      resize: vertical;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      background: #1a1a2e;
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
    }

    .channel textarea:focus {
      border-color: var(--ch, var(--hot));
    }

    .channel-error {
      min-height: 16px;
      margin: 6px 0 0;
      font-size: 11px;
      color: #ff8888;
    }

    #transport {
      display: flex;
      gap: 8px;
    }

    #transport .btn { flex: 1 1 auto; }

    #mix-mode {
      display: flex;
      gap: 4px;
      flex: 1 1 auto;
    }

    #mix-mode .btn { flex: 1 1 auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <main id="canvas-holder"></main>
    <div id="channels"></div>
    <div id="transport">
      <div id="mix-mode">
        <button class="btn on" id="mix-layered" type="button">layered</button>
        <button class="btn" id="mix-solo" type="button">solo</button>
      </div>
      <button class="btn" id="stop-all">stop all</button>
    </div>
  </div>
  <script src="strudel-sounds.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
